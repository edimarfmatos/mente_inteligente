<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Totem Interativo - Avatar Silhueta com Libras e Voz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080810;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
      padding: 16px 32px;
      border-radius: 16px;
      text-align: center;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .status { font-size: 1.2rem; color: #00f0ff; font-weight: 600; letter-spacing: 0.5px; }
    .subtitle { font-size: 0.95rem; color: #94a3b8; margin-top: 6px; }
  </style>

  <!-- CDNs do MediaPipe (Mãos e Câmera) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <video id="input-video" playsinline></video>
    <canvas id="output-canvas"></canvas>
    
    <div id="ui-overlay">
      <div id="status" class="status">Inicializando Avatar...</div>
      <div id="subtitle" class="subtitle">Aguardando interação visual e gestual</div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusDiv = document.getElementById('status');
    const subtitleDiv = document.getElementById('subtitle');

    let currentPerfil = 'masculino'; // 'masculino' | 'feminino'
    let currentGesture = '';

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. Síntese de Voz (Resposta do Avatar)
    function falar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
        subtitleDiv.innerText = `Avatar: "${texto}"`;
      }
    }

    // 2. Renderização da Silhueta com Traços e Efeito Glow
    function drawSilhouette(ctx, width, height, handLandmarksList) {
      ctx.clearRect(0, 0, width, height);

      // Estilo de traço neon
      const primaryColor = currentPerfil === 'feminino' ? '#ff007f' : '#00f0ff';
      ctx.strokeStyle = primaryColor;
      ctx.shadowColor = primaryColor;
      ctx.shadowBlur = 18;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';

      const cx = width / 2;
      const cy = height / 2.3;

      // Contorno da Cabeça
      ctx.beginPath();
      ctx.ellipse(cx, cy - 90, 55, 75, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Olhos
      ctx.beginPath();
      ctx.arc(cx - 20, cy - 100, 5, 0, Math.PI * 2);
      ctx.arc(cx + 20, cy - 100, 5, 0, Math.PI * 2);
      ctx.stroke();

      // Boca (Sorriso)
      ctx.beginPath();
      ctx.arc(cx, cy - 75, 18, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      // Pescoço e Ombros
      ctx.beginPath();
      ctx.moveTo(cx - 15, cy - 15);
      ctx.lineTo(cx - 15, cy + 10);
      ctx.lineTo(cx - 110, cy + 60); // Ombro Esquerdo
      ctx.lineTo(cx - 120, cy + 280); // Lateral Esquerda do Corpo
      
      ctx.moveTo(cx + 15, cy - 15);
      ctx.lineTo(cx + 15, cy + 10);
      ctx.lineTo(cx + 110, cy + 60); // Ombro Direito
      ctx.lineTo(cx + 120, cy + 280); // Lateral Direita do Corpo
      ctx.stroke();

      // Traços das Mãos / Libras em Tempo Real
      if (handLandmarksList && handLandmarksList.length > 0) {
        handLandmarksList.forEach(landmarks => {
          ctx.beginPath();
          landmarks.forEach((lm, index) => {
            const x = (1 - lm.x) * width; // Espelhado para interação nativa
            const y = lm.y * height;
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
      }
    }

    // 3. Reconhecimento de Gestos Simplificados de Libras
    function detectLibras(handLandmarks) {
      if (!handLandmarks) return null;

      const wrist = handLandmarks[0];
      const indexTip = handLandmarks[8];
      const thumbTip = handLandmarks[4];

      // Gesto: Mão levantada acima da cabeça (Cumprimento / Olá / Bom dia)
      if (indexTip.y < wrist.y - 0.25) {
        return 'Olá! Bom dia!';
      }
      
      // Gesto: Polegar e indicador próximos no peito (Posso ajudar?)
      const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
      if (dist < 0.05) {
        return 'Como posso ajudar?';
      }

      return null;
    }

    // 4. Configuração do MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults((results) => {
      drawSilhouette(canvasCtx, canvasElement.width, canvasElement.height, results.multiHandLandmarks);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const gestureDetected = detectLibras(results.multiHandLandmarks[0]);
        
        if (gestureDetected && gestureDetected !== currentGesture) {
          currentGesture = gestureDetected;
          statusDiv.innerText = `Sinal Detectado: ${gestureDetected}`;
          falar(gestureDetected);
        }
      } else {
        statusDiv.innerText = `Avatar Ativo (${currentPerfil.toUpperCase()})`;
      }
    });

    // 5. Inicialização do Vídeo e Câmera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
