<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Totem Mobile - Silhueta e Libras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #00f0ff;
      padding: 10px 20px;
      border-radius: 20px;
      text-align: center;
      z-index: 10;
      width: 85%;
      max-width: 350px;
    }
    .status { font-size: 1rem; color: #00f0ff; font-weight: 600; }
    .subtitle { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <video id="input-video" playsinline webkit-playsinline></video>
    <canvas id="output-canvas"></canvas>
    
    <div id="ui-overlay">
      <div id="status" class="status">Iniciando Câmera...</div>
      <div id="subtitle" class="subtitle">Mostre a mão para interagir</div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusDiv = document.getElementById('status');
    const subtitleDiv = document.getElementById('subtitle');

    let currentPerfil = 'masculino'; // 'masculino' ou 'feminino'
    let currentGesture = '';

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. Síntese de Voz (Resposta do Avatar)
    function falar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
        subtitleDiv.innerText = `Avatar: "${texto}"`;
      }
    }

    // 2. Desenho dos Contornos
    function drawDetailedSilhouette(ctx, width, height, handLandmarksList) {
      ctx.clearRect(0, 0, width, height);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = width / 2;
      const cy = height / 2.2;

      ctx.save();
      ctx.translate(cx, cy);

      // --- CAMINHO MASCULINO ---
      const maleSuitPath = new Path2D(`
        M-30,-120 C-45,-120 -50,-100 -50,-85 C-50,-70 -45,-55 -30,-55 L30,-55 C45,-55 50,-70 50,-85 C50,-100 45,-120 30,-120 Z
        M-50,-85 L-95,-70 L-75,90 L-85,280 L-30,280 L-5,100 L5,100 L30,280 L85,280 L75,90 L95,-70 L50,-85 Z
        M-25,-90 L-15,-70 L-20,-80 M15,-70 L25,-90 L20,-80
        M0,-60 L-8,-80 M0,-60 L8,-80
        M0,-50 C-10,-55 -15,-65 -15,-75 L0,-85 L15,-75 C15,-65 10,-55 0,-50 Z
        M0,-5 L-4,-15 L-6,-80 M0,-5 L4,-15 L6,-80
        M-80,-20 C-100,-20 -110,-10 -110,10 L-95,140 C-95,150 -90,160 -80,160
        M80,-20 C100,-20 110,-10 110,10 L95,140 C95,150 90,160 80,160
      `);

      // --- CAMINHO FEMININO ---
      const femaleSuitPath = new Path2D(`
        M-25,-120 C-40,-120 -45,-105 -45,-90 C-45,-75 -40,-60 -25,-60 L25,-60 C40,-60 45,-75 45,-90 C45,-105 40,-120 25,-120 Z
        M-45,-90 L-80,-75 L-65,70 L-75,280 L75,280 L65,70 L80,-75 L45,-90
        M-20,-90 L-10,-75 M10,-75 L20,-90
        M-65,40 C-50,45 -35,50 0,50 C35,50 50,45 65,40
        M-85,-25 C-105,-25 -115,-15 -115,5 L-100,120 C-100,130 -95,140 -85,140
        M85,-25 C105,-25 115,-15 115,5 L100,120 C100,130 95,140 85,140
      `);

      if (currentPerfil === 'masculino') {
        ctx.stroke(maleSuitPath);
      } else {
        ctx.stroke(femaleSuitPath);
      }
      ctx.restore();

      // --- TRAÇOS DAS MÃOS (Luvas Brancas) ---
      if (handLandmarksList && handLandmarksList.length > 0) {
        handLandmarksList.forEach(landmarks => {
          ctx.beginPath();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 12;
          ctx.lineCap = 'round';

          const connections = Hands.HAND_CONNECTIONS;
          connections.forEach(([i, j]) => {
            const p1 = landmarks[i];
            const p2 = landmarks[j];
            ctx.moveTo((1 - p1.x) * width, p1.y * height);
            ctx.lineTo((1 - p2.x) * width, p2.y * height);
          });
          ctx.stroke();

          ctx.fillStyle = '#111111';
          ctx.lineWidth = 2;
          landmarks.forEach(lm => {
            ctx.beginPath();
            ctx.arc((1 - lm.x) * width, lm.y * height, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
        });
      }
    }

    // 3. Reconhecimento de Gestos em Libras
    function detectLibras(handLandmarks) {
      if (!handLandmarks) return null;

      const wrist = handLandmarks[0];
      const indexTip = handLandmarks[8];
      const thumbTip = handLandmarks[4];

      if (indexTip.y < wrist.y - 0.2) {
        return 'Olá! Bom dia!';
      }
      
      const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
      if (dist < 0.05) {
        return 'Como posso ajudar?';
      }

      return null;
    }

    // 4. Configuração do MediaPipe
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0, // Ajustado para 0 para ser leve no processador do celular
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      drawDetailedSilhouette(canvasCtx, canvasElement.width, canvasElement.height, results.multiHandLandmarks);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const gestureDetected = detectLibras(results.multiHandLandmarks[0]);
        
        if (gestureDetected && gestureDetected !== currentGesture) {
          currentGesture = gestureDetected;
          statusDiv.innerText = `Sinal: ${gestureDetected}`;
          falar(gestureDetected);
        }
      } else {
        statusDiv.innerText = `Avatar Ativo`;
      }
    });

    // 5. Inicialização da Câmera Frontal/Traseira do Celular
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,  // Resolução reduzida para garantir boa taxa de quadros no smartphone
      height: 480,
      facingMode: "user" // Usa a câmera frontal por padrão
    });

    camera.start();
  </script>
</body>
</html>
