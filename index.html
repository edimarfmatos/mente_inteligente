<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Totem Interativo - Silhueta Elegante com Libras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e2dfd8; /* Fundo claro para destacar a silhueta preta */
      color: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #1a1a1a;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      padding: 16px 32px;
      border-radius: 12px;
      text-align: center;
      z-index: 10;
    }
    .status { font-size: 1.2rem; color: #1a1a1a; font-weight: 700; }
    .subtitle { font-size: 0.95rem; color: #555555; margin-top: 4px; }
  </style>

  <!-- CDNs do MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <video id="input-video" playsinline></video>
    <canvas id="output-canvas"></canvas>
    
    <div id="ui-overlay">
      <div id="status" class="status">Silhueta Pronta</div>
      <div id="subtitle" class="subtitle">Faça um sinal de Libras em frente à câmera</div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusDiv = document.getElementById('status');
    const subtitleDiv = document.getElementById('subtitle');

    let currentPerfil = 'masculino'; // 'masculino' ou 'feminino'
    let currentGesture = '';

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function falar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
        subtitleDiv.innerText = `Avatar: "${texto}"`;
      }
    }

    // Desenha o corpo preenchido em preto (Padrão das Imagens)
    function drawBodySilhouette(ctx, width, height) {
      const cx = width / 2;
      const cy = height / 2.2;

      ctx.fillStyle = '#111111'; // Preto sólido da silhueta

      if (currentPerfil === 'masculino') {
        // --- CABEÇA ---
        ctx.beginPath();
        ctx.ellipse(cx, cy - 140, 40, 52, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- GOLA & GRAVATA (Acentos em Branco/Cinza) ---
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); // Gola da camisa
        ctx.moveTo(cx - 18, cy - 90);
        ctx.lineTo(cx, cy - 50);
        ctx.lineTo(cx + 18, cy - 90);
        ctx.fill();

        ctx.fillStyle = '#111111';
        ctx.beginPath(); // Gravata
        ctx.moveTo(cx - 6, cy - 75);
        ctx.lineTo(cx + 6, cy - 75);
        ctx.lineTo(cx + 4, cy - 15);
        ctx.lineTo(cx, cy - 5);
        ctx.lineTo(cx - 4, cy - 15);
        ctx.fill();

        // --- CORPO & TERNO ---
        ctx.beginPath();
        ctx.moveTo(cx - 18, cy - 88);
        ctx.lineTo(cx - 95, cy - 50);  // Ombro esquerdo
        ctx.lineTo(cx - 75, cy + 120); // Cintura esquerda
        ctx.lineTo(cx - 85, cy + 320); // Perna esquerda
        ctx.lineTo(cx - 30, cy + 320);
        ctx.lineTo(cx - 5, cy + 140);  // Entrepernas
        ctx.lineTo(cx + 5, cy + 140);
        ctx.lineTo(cx + 30, cy + 320);
        ctx.lineTo(cx + 85, cy + 320); // Perna direita
        ctx.lineTo(cx + 75, cy + 120); // Cintura direita
        ctx.lineTo(cx + 95, cy - 50);  // Ombro direito
        ctx.lineTo(cx + 18, cy - 88);
        ctx.fill();

      } else {
        // --- PERFIL FEMININO ---
        ctx.beginPath();
        ctx.ellipse(cx, cy - 135, 38, 50, 0, 0, Math.PI * 2); // Cabeça/Cabelo
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx - 15, cy - 85);
        ctx.lineTo(cx - 75, cy - 55);  // Ombro esquerdo
        ctx.lineTo(cx - 55, cy + 40);  // Cintura marcada
        ctx.lineTo(cx - 70, cy + 300); // Calça/Saia
        ctx.lineTo(cx + 70, cy + 300);
        ctx.lineTo(cx + 55, cy + 40);
        ctx.lineTo(cx + 75, cy - 55);  // Ombro direito
        ctx.lineTo(cx + 15, cy - 85);
        ctx.fill();
      }
    }

    // Desenha as mãos rastreadas em BRANCO (Detalhe de Luva Branca)
    function drawWhiteGloveHands(ctx, width, height, handLandmarksList) {
      if (!handLandmarksList) return;

      handLandmarksList.forEach(landmarks => {
        // Estilo da luva
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 2;

        // Desenha palma e preenchimento dos dedos em formato estilizado
        landmarks.forEach((lm) => {
          const x = (1 - lm.x) * width;
          const y = lm.y * height;

          ctx.beginPath();
          ctx.arc(x, y, 11, 0, Math.PI * 2); // Nós dos dedos com "efeito luva"
          ctx.fill();
          ctx.stroke();
        });

        // Conecta as articulações da luva
        const connections = Hands.HAND_CONNECTIONS;
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 14; // Traço espesso para simular o preenchimento da luva
        ctx.lineCap = 'round';

        connections.forEach(([i, j]) => {
          const p1 = landmarks[i];
          const p2 = landmarks[j];
          ctx.moveTo((1 - p1.x) * width, p1.y * height);
          ctx.lineTo((1 - p2.x) * width, p2.y * height);
        });
        ctx.stroke();
      });
    }

    function detectLibras(handLandmarks) {
      if (!handLandmarks) return null;

      const wrist = handLandmarks[0];
      const indexTip = handLandmarks[8];
      const thumbTip = handLandmarks[4];

      // Gesto: Mão levantada (Olá / Bom dia)
      if (indexTip.y < wrist.y - 0.2) {
        return 'Olá! Bom dia!';
      }
      
      // Gesto: Pinça indicador-polegar (Posso ajudar?)
      const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
      if (dist < 0.05) {
        return 'Como posso ajudar?';
      }

      return null;
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // 1. Renderiza o corpo preenchido no padrão visual solicitado
      drawBodySilhouette(canvasCtx, canvasElement.width, canvasElement.height);

      // 2. Renderiza as mãos estilizadas como luvas brancas
      if (results.multiHandLandmarks) {
        drawWhiteGloveHands(canvasCtx, canvasElement.width, canvasElement.height, results.multiHandLandmarks);

        const gestureDetected = detectLibras(results.multiHandLandmarks[0]);
        if (gestureDetected && gestureDetected !== currentGesture) {
          currentGesture = gestureDetected;
          statusDiv.innerText = `Sinal: ${gestureDetected}`;
          falar(gestureDetected);
        }
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
