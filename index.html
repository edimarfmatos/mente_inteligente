<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Spectro - Totem Interativo</title>
  <!-- MediaPipe Pose & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #05050d;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Título da Aplicação fora do totem */
    .app-header {
      margin-bottom: 15px;
      text-align: center;
    }

    .app-header h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .app-header p {
      font-size: 0.85rem;
      color: #a0a0c0;
    }

    /* Container Principal do Totem (Proporção Vertical 9:16) */
    .totem-container {
      position: relative;
      width: 380px;
      height: 650px;
      background: radial-gradient(circle at center, #101025 0%, #030308 100%);
      border: 3px solid #00f0ff;
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 240, 255, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Indicador de Status superior */
    .totem-header {
      width: 100%;
      padding: 15px;
      text-align: center;
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 0, 0, 0) 100%);
      z-index: 10;
    }

    .totem-brand {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #00f0ff;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 12px;
      font-size: 0.7rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #a0f0ff;
    }

    /* Área de renderização das telas e do espectro */
    .viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    video {
      display: none; /* Câmera oculta para privacidade */
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Painel Inferior de Mensagens Interativas */
    .totem-footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 25px 20px 30px;
      background: linear-gradient(0deg, rgba(3, 3, 8, 0.95) 0%, rgba(3, 3, 8, 0.6) 70%, rgba(3, 3, 8, 0) 100%);
      text-align: center;
      z-index: 10;
    }

    .greeting-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .greeting-subtitle {
      font-size: 0.85rem;
      color: #7f9bb3;
      line-height: 1.3;
    }

    .action-btn {
      margin-top: 15px;
      padding: 10px 22px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #05050d;
      background: #00f0ff;
      border: none;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    .action-btn.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>PROJETO SPECTRO</h1>
    <p>Totem Interativo com IA & Visão Computacional em Tempo Real</p>
  </div>

  <div class="totem-container">
    <div class="totem-header">
      <div class="totem-brand">SPECTRO VISION v1.0</div>
      <div id="statusBadge" class="status-badge">Inicializando Câmera...</div>
    </div>

    <div class="viewport">
      <video id="webcamInput" playsinline></video>
      <canvas id="spectroCanvas"></canvas>
    </div>

    <div class="totem-footer">
      <div id="greetingTitle" class="greeting-title">Aproxime-se...</div>
      <div id="greetingSubtitle" class="greeting-subtitle">O totem inteligente detecta sua presença automaticamente</div>
      <button id="actionBtn" class="action-btn">Posso Ajudar?</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcamInput');
    const canvasElement = document.getElementById('spectroCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusBadge = document.getElementById('statusBadge');
    const greetingTitle = document.getElementById('greetingTitle');
    const greetingSubtitle = document.getElementById('greetingSubtitle');
    const actionBtn = document.getElementById('actionBtn');

    let userDetected = false;

    // Conexões esqueléticas do MediaPipe Pose
    const POSE_CONNECTIONS = [
      [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Membros superiores
      [11, 23], [12, 24], [23, 24],                   // Tronco
      [23, 25], [24, 26], [25, 27], [26, 28]          // Membros inferiores
    ];

    function setupCanvasSize() {
      canvasElement.width = canvasElement.offsetWidth;
      canvasElement.height = canvasElement.offsetHeight;
    }
    window.addEventListener('resize', setupCanvasSize);

    // Processamento de cada frame do MediaPipe
    function onResults(results) {
      if (statusBadge.innerText !== "Procurando Cliente...") {
        statusBadge.innerText = "Sistema Ativo";
        statusBadge.style.borderColor = "rgba(0, 240, 255, 0.8)";
      }

      // Limpar Canvas
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks && results.poseLandmarks.length > 0) {
        const landmarks = results.poseLandmarks;
        
        // Verifica se a pessoa está próxima (pela visibilidade dos ombros/rosto)
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];
        const isClose = (leftShoulder.visibility > 0.6 && rightShoulder.visibility > 0.6);

        if (isClose) {
          if (!userDetected) {
            userDetected = true;
            triggerUserDetectedState();
          }

          // Desenhar Espectro / Traços Neon
          drawSpectroSilhouette(landmarks);
        } else {
          if (userDetected) {
            userDetected = false;
            triggerIdleState();
          }
        }
      } else {
        if (userDetected) {
          userDetected = false;
          triggerIdleState();
        }
      }

      canvasCtx.restore();
    }

    // Função de Renderização do Espectro Neon
    function drawSpectroSilhouette(landmarks) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      // Estilo Espectro Cyan / Neon
      canvasCtx.strokeStyle = '#00f0ff';
      canvasCtx.lineWidth = 4;
      canvasCtx.shadowBlur = 15;
      canvasCtx.shadowColor = '#00f0ff';
      canvasCtx.fillStyle = '#ff007f';

      // 1. Desenhar Linhas da Silhueta (Ossos)
      POSE_CONNECTIONS.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];

        if (p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
          canvasCtx.beginPath();
          // Espelhamento horizontal para experiência natural de espelho
          canvasCtx.moveTo((1 - p1.x) * w, p1.y * h);
          canvasCtx.lineTo((1 - p2.x) * w, p2.y * h);
          canvasCtx.stroke();
        }
      });

      // 2. Desenhar Nós/Pontos do Espectro
      landmarks.forEach((lm, index) => {
        // Renderiza apenas os pontos principais do tronco, braços e rosto
        if (lm.visibility > 0.5 && index <= 16) {
          const x = (1 - lm.x) * w;
          const y = lm.y * h;

          canvasCtx.beginPath();
          canvasCtx.arc(x, y, index === 0 ? 8 : 4, 0, 2 * Math.PI);
          canvasCtx.fill();
        }
      });
    }

    // Estados da Interface
    function triggerUserDetectedState() {
      greetingTitle.innerText = "Olá! Bem-vindo!";
      greetingTitle.style.color = "#00f0ff";
      greetingSubtitle.innerText = "Identificamos sua presença. Como podemos te ajudar hoje?";
      actionBtn.classList.add('visible');
    }

    function triggerIdleState() {
      greetingTitle.innerText = "Aproxime-se...";
      greetingTitle.style.color = "#ffffff";
      greetingSubtitle.innerText = "O totem inteligente detecta sua presença automaticamente";
      actionBtn.classList.remove('visible');
    }

    // Inicialização do MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // Inicialização da Câmera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    setupCanvasSize();
    camera.start().then(() => {
      statusBadge.innerText = "Procurando Cliente...";
    }).catch(err => {
      console.error(err);
      statusBadge.innerText = "Erro ao Acessar Câmera";
      statusBadge.style.color = "#ff4d4d";
    });
  </script>
</body>
</html>
